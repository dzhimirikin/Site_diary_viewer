<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Diary</title>

    <link rel="stylesheet" href="gallery.css">
</head>
<body>

    <h1 id="project-title"></h1>

<div id="project-info"
     class="project-info">
</div>

<div id="selection-info"
     class="project-info">
    Selected: 0 photos
</div>


<div class="selection-buttons">

    <button id="select-all">
        Select All
    </button>

    <button id="clear-all">
        Clear
    </button>

    <button id="export-pdf">
        Export PDF
    </button>


    <button id="settings-btn">
        ⚙ Settings
    </button>

    <button id="admin-btn">
        Admin
    </button>

</div>

    <div id="gallery"></div>

<div id="editor-modal">

<div id="editor-window">

    <div id="editor-header">

        <span>
            Comment editor
        </span>

        <button
            id="editor-close">
            ✕
        </button>

    </div>

    <textarea
        id="editor-text">
    </textarea>

    <div id="editor-buttons">

        <button
            id="editor-save">
            Save
        </button>

        <button
            id="editor-cancel">
            Cancel
        </button>

    </div>

</div>

</div>

</div>

    <!-- Viewer фотографий -->
    <div id="photo-viewer">

        <button id="viewer-prev">
            ◀
        </button>

        <img id="viewer-image">

        <button id="viewer-next">
            ▶
        </button>

        <button id="viewer-close">
            ✕
        </button>

    </div>

<div id="settings-modal">

    <div id="settings-window">

        <h2>
            PDF Settings
        </h2>

        <label>
            Font
        </label>

        <select id="pdf-font">

            <option value="isocpeui">
                ISOCP
            </option>

            <option value="isocpeur">
                ISOCPR
            </option>

        </select>

        <div id="font-preview">
            ABCDEFG 1234567890
        </div>

        <label>
            Font size
        </label>

        <input
            id="pdf-size"
            type="number"
            step="0.5"
        >

        <label>
            Character spacing
        </label>

        <input
            id="pdf-charspace"
            type="number"
            step="0.01"
        >

        <div class="settings-buttons">

            <button id="settings-save">
                Save
            </button>

            <button id="settings-cancel">
                Cancel
            </button>

        </div>

    </div>

</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="../isocpeui-normal.js"></script>

    <script src="../isocpeur-normal.js"></script>

    <script type="module" src="firebase.js"></script>

    <script src="gallery.js"></script>

</body>
</html>
